<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Relato Policial Padrão</title>
    <meta name="theme-color" content="#0A0A0A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="PMRv P19">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['IBM Plex Sans', 'ui-sans-serif', 'system-ui'],
                        mono: ['IBM Plex Mono', 'ui-monospace', 'monospace'],
                    },
                    colors: {
                        pmrv: '#0A0A0A',
                        charcoal: '#2B2B2B',
                        bone: '#F5F0E8',
                        gold: '#C8933F',
                        brick: '#C44536',
                        'step-idle': '#D8D2C4',
                        'step-done': '#C8933F',
                        whatsapp: '#16a34a'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bone text-charcoal antialiased font-sans pb-10">

    <header class="bg-white border-b-2 border-charcoal p-4 sticky top-0 z-50">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="w-4 h-4 bg-gold border-2 border-pmrv" aria-hidden="true"></span>
                <h1 class="text-lg font-mono font-semibold tracking-tight uppercase text-pmrv">Relato Policial Padrão</h1>
            </div>
            <span id="offline-indicator" class="hidden bg-brick text-white text-[10px] px-2 py-1 font-mono font-semibold uppercase tracking-wider animate-pulse">Offline</span>
        </div>
    </header>

    <!-- Stepper Indicator -->
    <div class="max-w-xl mx-auto px-6 py-5">
        <div class="flex items-center justify-between relative">
            <div class="absolute left-0 top-1/2 w-full h-0.5 bg-step-idle -translate-y-1/2 z-0"></div>
            <div id="stepper-progress" class="absolute left-0 top-1/2 w-0 h-0.5 bg-pmrv -translate-y-1/2 z-0 transition-all duration-300"></div>

            <div class="step-dot z-10 w-9 h-9 bg-pmrv border-2 border-pmrv flex items-center justify-center font-mono font-semibold text-sm" data-step="1">1</div>
            <div class="step-dot z-10 w-9 h-9 bg-step-idle border-2 border-charcoal flex items-center justify-center font-mono font-semibold text-sm" data-step="2">2</div>
            <div class="step-dot z-10 w-9 h-9 bg-step-idle border-2 border-charcoal flex items-center justify-center font-mono font-semibold text-sm" data-step="3">3</div>
            <div id="dot-vitimas" class="step-dot z-10 w-9 h-9 bg-step-idle border-2 border-charcoal flex items-center justify-center font-mono font-semibold text-sm hidden" data-step="4">4</div>
            <div class="step-dot z-10 w-9 h-9 bg-step-idle border-2 border-charcoal flex items-center justify-center font-mono font-semibold text-sm" data-step="5">5</div>
            <div class="step-dot z-10 w-9 h-9 bg-step-idle border-2 border-charcoal flex items-center justify-center font-mono font-semibold text-sm" data-step="6">✓</div>
        </div>
    </div>

    <main id="wizard-container" class="max-w-xl mx-auto p-4 relative overflow-hidden">

        <!-- Passo 1: Identificação -->
        <section id="step-1" class="step-content bg-white border-2 border-charcoal shadow-[4px_4px_0_#2B2B2B] p-6 space-y-4">
            <div class="flex justify-between items-center border-b-2 border-charcoal pb-3 mb-4">
                <h2 class="text-lg font-mono font-semibold uppercase tracking-tight text-pmrv"><span class="text-gold">1.</span> Identificação</h2>
                <button onclick="startVoiceCommandStep1()" id="mic-btn-step1" class="p-2 border-2 border-charcoal hover:bg-bone text-pmrv transition-all" title="Preencher por voz (Diga: Protocolo..., Viatura..., Conhecimento...)">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z"/></svg>
                </button>
            </div>
            <div>
                <label for="pmrv_sade" class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal mb-2">Protocolo SADE</label>
                <input type="text" id="pmrv_sade" placeholder="Ex: 1234567" inputmode="numeric" maxlength="9" oninput="pmrv_validarSade(this)" class="w-full p-3 bg-white border-2 border-charcoal focus:ring-2 focus:ring-gold outline-none transition">
            </div>
            <div>
                <label for="pmrv_vtr" class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal mb-2">Viatura (PM-XXXX)</label>
                <input type="text" id="pmrv_vtr" placeholder="Ex: 1234" oninput="pmrv_validarVtr(this)" class="w-full p-3 bg-white border-2 border-charcoal focus:ring-2 focus:ring-gold outline-none transition text-lg font-mono font-semibold tracking-widest uppercase">
            </div>
            <div>
                <label class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal mb-2">Hora do Sinistro</label>
                <div class="flex gap-4 p-3 bg-bone border-2 border-charcoal">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="pmrv_hora_tipo" id="pmrv_hora_auto" checked onclick="pmrv_atualizar()" class="w-4 h-4 text-pmrv focus:ring-gold">
                        <span class="text-sm">Automática (Agora)</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="pmrv_hora_tipo" id="pmrv_hora_manual" onclick="pmrv_atualizar()" class="w-4 h-4 text-pmrv focus:ring-gold">
                        <span class="text-sm">Manual</span>
                    </label>
                </div>
                <input type="time" id="pmrv_input_hora" class="hidden w-full p-3 mt-2 bg-white border-2 border-charcoal focus:ring-2 focus:ring-gold outline-none transition" oninput="pmrv_atualizar()">
            </div>
            <div>
                <label for="pmrv_conhecimento" class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal mb-2">Conhecimento da Ocorrência</label>
                <select id="pmrv_conhecimento" onchange="pmrv_atualizar()" class="w-full p-3 bg-white border-2 border-charcoal focus:ring-2 focus:ring-gold outline-none transition">
                    <option value="pela Central">Pela Central</option>
                    <option value="por populares">Por Populares</option>
                    <option value="pela guarnição">Pela Guarnição</option>
                </select>
            </div>
            <button onclick="nextStep()" class="w-full bg-pmrv text-white font-mono font-semibold uppercase tracking-wider py-4 border-2 border-pmrv shadow-[4px_4px_0_#C8933F] hover:bg-charcoal transition flex items-center justify-center gap-2">
                Seguinte
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </section>

        <!-- Passo 2: Localização -->
        <section id="step-2" class="step-content hidden bg-white border-2 border-charcoal shadow-[4px_4px_0_#2B2B2B] p-6 space-y-4">
            <div class="flex justify-between items-center border-b-2 border-charcoal pb-3 mb-4">
                <h2 class="text-lg font-mono font-semibold uppercase tracking-tight text-pmrv"><span class="text-gold">2.</span> Localização</h2>
                <button onclick="startVoiceCommandStep2()" id="mic-btn-step2" class="p-2 border-2 border-charcoal hover:bg-bone text-pmrv transition-all" title="Preencher por voz (Diga: Rodovia..., KM...)">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z"/></svg>
                </button>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="pmrv_rodovia" class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal mb-2">Rodovia</label>
                    <select id="pmrv_rodovia" onchange="pmrv_verificarRodovia()" class="w-full p-3 bg-white border-2 border-charcoal focus:ring-2 focus:ring-gold outline-none transition font-mono font-semibold">
                        <option value="SC-401">SC-401</option>
                        <option value="SC-400">SC-400</option>
                        <option value="SC-402">SC-402</option>
                        <option value="SC-403">SC-403</option>
                        <option value="SC-404">SC-404</option>
                        <option value="SC-405">SC-405</option>
                        <option value="SC-406">SC-406</option>
                        <option value="SC-281">SC-281</option>
                        <option value="SC-407">SC-407</option>
                        <option value="SC-408">SC-408</option>
                    </select>
                </div>
                <div>
                    <label for="pmrv_km" class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal mb-2">KM</label>
                    <input type="text" id="pmrv_km" placeholder="Ex: 12,345" oninput="pmrv_validarKM(this)" class="w-full p-3 bg-white border-2 border-charcoal focus:ring-2 focus:ring-gold outline-none transition text-center font-mono font-semibold" maxlength="6">
                </div>
            </div>
            <div>
                <label for="pmrv_cidade" class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal mb-2">Cidade</label>
                <input type="text" id="pmrv_cidade" oninput="pmrv_atualizar()" class="w-full p-3 border-2 border-charcoal focus:ring-2 focus:ring-gold outline-none transition bg-gray-50">
                <select id="pmrv_cidade_407" class="hidden w-full p-3 mt-2 bg-bone border-2 border-gold focus:ring-2 focus:ring-gold outline-none transition" onchange="pmrv_selecionarCidade407()">
                    <option value="Biguaçu/SC">Biguaçu/SC</option>
                    <option value="Antônio Carlos/SC">Antônio Carlos/SC</option>
                </select>
                <select id="pmrv_cidade_281" class="hidden w-full p-3 mt-2 bg-bone border-2 border-gold focus:ring-2 focus:ring-gold outline-none transition" onchange="pmrv_selecionarCidade281()">
                    <option value="São José/SC">São José/SC</option>
                    <option value="São Pedro de Alcântara/SC">São Pedro de Alcântara/SC</option>
                </select>
            </div>
            <div>
                <label for="pmrv_sentido" class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal mb-2">Sentido da Via</label>
                <select id="pmrv_sentido" onchange="pmrv_toggleSentidoManual()" class="w-full p-3 bg-white border-2 border-charcoal focus:ring-2 focus:ring-gold outline-none transition">
                    <option value="Crescente">Crescente</option>
                    <option value="Decrescente">Decrescente</option>
                    <option value="Centro–Bairro">Centro–Bairro</option>
                    <option value="Bairro–Centro">Bairro–Centro</option>
                    <option value="Norte–Sul">Norte–Sul</option>
                    <option value="Sul–Norte">Sul–Norte</option>
                    <option value="MANUAL">Outro (Digitar manualmente)</option>
                </select>
                <input type="text" id="pmrv_sentido_manual" class="hidden w-full p-3 mt-2 bg-white border-2 border-charcoal focus:ring-2 focus:ring-gold outline-none transition" placeholder="Ex: Sentido Palhoça" oninput="pmrv_atualizar()">
            </div>
            <div class="flex gap-3 pt-4">
                <button onclick="prevStep()" class="flex-1 bg-white text-charcoal font-mono font-semibold uppercase tracking-wider py-4 border-2 border-charcoal hover:bg-bone transition">Voltar</button>
                <button onclick="nextStep()" class="flex-[2] bg-pmrv text-white font-mono font-semibold uppercase tracking-wider py-4 border-2 border-pmrv shadow-[4px_4px_0_#C8933F] hover:bg-charcoal transition">Seguinte</button>
            </div>
        </section>

        <!-- Passo 3: Natureza e Dinâmica -->
        <section id="step-3" class="step-content hidden bg-white border-2 border-charcoal shadow-[4px_4px_0_#2B2B2B] p-6 space-y-4">
            <div class="flex justify-between items-center border-b-2 border-charcoal pb-3 mb-4">
                <h2 class="text-lg font-mono font-semibold uppercase tracking-tight text-pmrv"><span class="text-gold">3.</span> Natureza e Dinâmica</h2>
                <button onclick="startVoiceRecognition('pmrv_dinamica_texto')" id="mic-btn" class="p-2 border-2 border-charcoal hover:bg-bone text-pmrv transition-all" title="Gravar por voz">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z"/></svg>
                </button>
            </div>
            <div>
                <label for="pmrv_ocorrencia" class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal mb-2">Classificação</label>
                <select id="pmrv_ocorrencia" onchange="pmrv_verificarVitimas()" class="w-full p-3 bg-bone border-2 border-pmrv text-pmrv font-mono font-semibold focus:ring-2 focus:ring-gold outline-none transition">
                    <option value="Sinistro de trânsito com danos materiais">APENAS DANOS MATERIAIS</option>
                    <option value="Sinistro de trânsito com vítima(s)">COM VÍTIMA(S)</option>
                </select>
            </div>
            <div>
                <label for="pmrv_subtipo" class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal mb-2">Tipo de Sinistro</label>
                <select id="pmrv_subtipo" onchange="pmrv_mudarSubtipo()" class="w-full p-3 bg-white border-2 border-charcoal focus:ring-2 focus:ring-gold outline-none transition">
                    <optgroup label="Atropelamento">
                        <option value="1.1">1.1 Atropelamento de Pedestre/Ciclista</option>
                        <option value="1.2">1.2 Atropelamento de Animal</option>
                    </optgroup>
                    <optgroup label="Abalroamento">
                        <option value="2.1">2.1 Abalroamento Longitudinal (Mesmo Sentido)</option>
                        <option value="2.2">2.2 Abalroamento Longitudinal (Sentidos Opostos)</option>
                        <option value="2.3">2.3 Abalroamento Transversal</option>
                    </optgroup>
                    <optgroup label="Colisão">
                        <option value="3.1">3.1 Colisão Frontal</option>
                        <option value="3.2">3.2 Colisão Traseira</option>
                        <option value="3.3">3.3 Colisão (Engavetamento)</option>
                    </optgroup>
                    <optgroup label="Choque">
                        <option value="4.1">4.1 Choque (Poste)</option>
                        <option value="4.6">4.6 Choque (Defensa)</option>
                        <option value="4.9">4.9 Choque (Objeto...)</option>
                    </optgroup>
                    <optgroup label="Perda de Controle">
                        <option value="5.1">5.1 Saída de Pista</option>
                        <option value="5.3">5.3 Capotamento</option>
                        <option value="5.4">5.4 Tombamento</option>
                        <option value="6.1">6.1 Saída de Pista + Choque (Poste)</option>
                        <option value="6.2">6.2 Saída de Pista + Choque (Muro)</option>
                        <option value="6.3">6.3 Saída de Pista + Choque (Defensa)</option>
                        <option value="6.4">6.4 Saída de Pista + Choque (Objeto...)</option>
                    </optgroup>
                    <optgroup label="Diversos">
                        <option value="7.1">7.1 Outros (Especificar)</option>
                    </optgroup>
                </select>
            </div>
            <div id="pmrv_box_objeto" class="hidden">
                <label for="pmrv_nome_objeto" class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal mb-2">Qual objeto?</label>
                <input type="text" id="pmrv_nome_objeto" placeholder="Ex: árvore, poste..." oninput="pmrv_mudarSubtipo()" class="w-full p-3 bg-bone border-2 border-gold outline-none focus:ring-2 focus:ring-gold transition">
            </div>
            <div id="pmrv_box_outros" class="hidden">
                <label for="pmrv_descricao_outros" class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal mb-2">Especifique</label>
                <input type="text" id="pmrv_descricao_outros" placeholder="Natureza da ocorrência..." oninput="pmrv_mudarSubtipo()" class="w-full p-3 bg-bone border-2 border-gold outline-none focus:ring-2 focus:ring-gold transition">
            </div>
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="pmrv_dinamica_texto" class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal">Descrição da Dinâmica (Editável)</label>
                    <button onclick="pmrv_configurarChaveIA()" class="p-1 border border-charcoal hover:bg-bone text-xs leading-none" title="Configurar chave da IA (Gemini)">🔑</button>
                </div>
                <div class="mb-2">
                    <span class="block font-mono text-[10px] font-semibold uppercase tracking-wider text-gold mb-1">Descrição IA</span>
                    <div class="flex gap-2">
                        <button id="ia-btn-juridica" onclick="pmrv_gerarDescricaoIA('juridica')" class="ia-style-btn flex-1 bg-white text-pmrv font-mono text-xs font-semibold uppercase tracking-wider py-2 border-2 border-charcoal hover:bg-bone transition disabled:opacity-50">Jurídica</button>
                        <button id="ia-btn-leiga" onclick="pmrv_gerarDescricaoIA('leiga')" class="ia-style-btn flex-1 bg-white text-pmrv font-mono text-xs font-semibold uppercase tracking-wider py-2 border-2 border-charcoal hover:bg-bone transition disabled:opacity-50">Leiga</button>
                        <button id="ia-btn-tecnica" onclick="pmrv_gerarDescricaoIA('tecnica')" class="ia-style-btn flex-1 bg-white text-pmrv font-mono text-xs font-semibold uppercase tracking-wider py-2 border-2 border-charcoal hover:bg-bone transition disabled:opacity-50">Técnica</button>
                    </div>
                </div>
                <textarea id="pmrv_dinamica_texto" rows="4" oninput="pmrv_atualizar()" spellcheck="true" class="w-full p-3 bg-white border-2 border-charcoal focus:ring-2 focus:ring-gold outline-none transition leading-relaxed"></textarea>
            </div>
            <div class="flex gap-3 pt-4">
                <button onclick="prevStep()" class="flex-1 bg-white text-charcoal font-mono font-semibold uppercase tracking-wider py-4 border-2 border-charcoal hover:bg-bone transition">Voltar</button>
                <button onclick="nextStep()" class="flex-[2] bg-pmrv text-white font-mono font-semibold uppercase tracking-wider py-4 border-2 border-pmrv shadow-[4px_4px_0_#C8933F] hover:bg-charcoal transition">Seguinte</button>
            </div>
        </section>

        <!-- Passo 4: Vítimas -->
        <section id="step-4" class="step-content hidden bg-white border-2 border-brick shadow-[4px_4px_0_#C44536] p-6 space-y-4">
            <h2 class="text-lg font-mono font-semibold uppercase tracking-tight text-brick mb-4 border-b-2 border-brick pb-3"><span class="text-pmrv">4.</span> Vítimas</h2>
            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal mb-2 text-center">Leves</label>
                    <input type="number" id="pmrv_qtd_leve" value="0" min="0" oninput="pmrv_atualizar()" class="w-full p-3 bg-white border-2 border-charcoal focus:ring-2 focus:ring-gold outline-none text-center font-mono font-semibold text-lg">
                </div>
                <div>
                    <label class="block font-mono text-xs font-semibold uppercase tracking-wider text-gold mb-2 text-center">Graves</label>
                    <input type="number" id="pmrv_qtd_grave" value="0" min="0" oninput="pmrv_atualizar()" class="w-full p-3 bg-bone border-2 border-gold focus:ring-2 focus:ring-gold outline-none text-center font-mono font-semibold text-lg text-charcoal">
                </div>
                <div>
                    <label class="block font-mono text-xs font-semibold uppercase tracking-wider text-brick mb-2 text-center">Óbitos</label>
                    <input type="number" id="pmrv_qtd_gravissima" value="0" min="0" oninput="pmrv_atualizar()" class="w-full p-3 bg-[#F9ECE9] border-2 border-brick focus:ring-2 focus:ring-brick outline-none text-center font-mono font-semibold text-lg text-brick">
                </div>
            </div>
            <div class="flex gap-3 pt-4">
                <button onclick="prevStep()" class="flex-1 bg-white text-charcoal font-mono font-semibold uppercase tracking-wider py-4 border-2 border-charcoal hover:bg-bone transition">Voltar</button>
                <button onclick="nextStep()" class="flex-[2] bg-pmrv text-white font-mono font-semibold uppercase tracking-wider py-4 border-2 border-pmrv shadow-[4px_4px_0_#C8933F] hover:bg-charcoal transition">Seguinte</button>
            </div>
        </section>

        <!-- Passo 5: Revisão Final -->
        <section id="step-5" class="step-content hidden bg-white border-2 border-charcoal shadow-[4px_4px_0_#2B2B2B] p-6 space-y-4">
            <div class="flex justify-between items-center border-b-2 border-charcoal pb-3 mb-4">
                <h2 class="text-lg font-mono font-semibold uppercase tracking-tight text-pmrv"><span class="text-gold">✓</span> Revisão e Edição Final</h2>
                <button onclick="startVoiceRecognition('pmrv_relatorio_edit')" class="p-2 border-2 border-charcoal hover:bg-bone text-pmrv transition-all" title="Adicionar por voz">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z"/></svg>
                </button>
            </div>
            <div class="mb-4">
                <div class="flex justify-between items-center mb-2">
                    <label for="pmrv_relatorio_edit" class="block font-mono text-xs font-semibold uppercase tracking-wider text-charcoal">Relatório Completo (Editável)</label>
                    <span class="text-[10px] text-charcoal font-mono font-semibold uppercase tracking-wider bg-bone border border-charcoal px-2 py-1">Revisão Geral</span>
                </div>
                <textarea id="pmrv_relatorio_edit" rows="14" spellcheck="true" oninput="pmrv_syncManualEdit(this)" class="w-full bg-pmrv text-bone p-4 font-mono text-xs leading-relaxed outline-none focus:ring-2 focus:ring-gold transition-all border-2 border-charcoal"></textarea>
